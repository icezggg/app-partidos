<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link id="favicon" rel="icon" type="image/png" href="https://drive.google.com/thumbnail?id=1EgzX6lA03zUq-9vnSk5CLQpIiHEl21d6">
    <title>TecSports</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&family=Oswald:wght@500;700&display=swap" rel="stylesheet">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#081059">
    <link rel="apple-touch-icon" href="logo-192.png">
    <link rel="stylesheet" href="style.css?v=38">
</head>
<body class="text-gray-100 min-h-screen">

    <div id="loader">
        <div class="spinner mb-4"></div>
        <p class="text-gray-500 font-bold tracking-widest uppercase">Cargando TecSports...</p>
    </div>

    <div style="display:none;" id="app-body">
                <header class="glass sticky top-0 z-50 w-full border-b border-white/5">
            <nav class="flex justify-between items-center p-4 max-w-7xl mx-auto">
                <div class="flex items-center gap-4">
                    <button onclick="toggleDrawer()" class="md:hidden text-2xl text-gray-300">☰</button>
                    <img onclick="showView('home')" class="app-logo h-16 md:h-20 w-auto cursor-pointer object-contain" src="https://via.placeholder.com/150x50?text=TecSports" alt="TecSports">
                </div>
                <div class="hidden md:flex items-center gap-1">
                    <a href="#" onclick="showView('home')" class="sidebar-link font-display tracking-wide text-lg uppercase">Inicio</a>
                    <a href="#" onclick="showView('players')" class="sidebar-link font-display tracking-wide text-lg uppercase">Jugadores</a>
                    <a href="#" onclick="showView('seasons')" class="sidebar-link font-display tracking-wide text-lg uppercase">Temporadas</a>
                    <a href="#" onclick="showView('duels')" class="sidebar-link font-display tracking-wide text-lg uppercase">Duelos</a>
                    <div class="relative group">
                        <button class="sidebar-link font-display tracking-wide text-lg uppercase">Generador ▾</button>
                        <div class="absolute hidden group-hover:block top-full right-0 w-56 pt-1 z-50">
                            <div class="bg-gray-900 rounded-xl p-2 border border-white/10">
                                <a href="#" onclick="showView('cardGen')" class="block px-4 py-2 hover:bg-white/5 rounded-lg text-sm">🃏 Generador de Carta</a>
                                <a href="#" onclick="showView('teamGen')" class="block px-4 py-2 hover:bg-white/5 rounded-lg text-sm">⚽ Generador de Equipos</a>
                            </div>
                        </div>
                    </div>
                    
                    <!-- SEPARADOR Y BOTONES A LA DERECHA -->
                <div class="flex items-center gap-2 ml-6 pl-6 border-l border-white/10">
                    <button id="auth-btn-pc" onclick="openLoginModal()" class="sidebar-link font-display tracking-wide text-lg uppercase text-green-400 hover:text-green-300">Ingresar</button>
                        <div id="user-area-pc" class="relative group hidden">
                            <button id="user-name-pc" class="sidebar-link font-display tracking-wide text-lg uppercase text-blue-400">Usuario ▾</button>
                            <div class="absolute hidden group-hover:block top-full right-0 w-48 pt-1 z-50">
                                <div class="bg-gray-900 rounded-xl p-2 border border-white/10">
                                    <a href="#" onclick="showView('perfil')" class="block px-4 py-2 hover:bg-white/5 rounded-lg text-sm">👤 Mi Perfil</a>
                                    <a href="#" onclick="openLogoutModal()" class="block px-4 py-2 hover:bg-white/5 rounded-lg text-sm text-red-400">🚪 Cerrar Sesión</a>
                                </div>
                            </div>
                        </div>
                        <button onclick="checkAdmin()" class="sidebar-link font-display tracking-wide text-lg uppercase text-gray-400 hover:text-gray-200">Admin</button>
                    </div>
                </div>
                <button onclick="checkAdmin()" class="md:hidden text-gray-400 text-3xl">⚙️</button>
            </nav>
        </header>

        <div id="drawer" class="fixed inset-0 z-50 transform -translate-x-full transition-transform duration-300 md:hidden glass-dark flex flex-col">
            <div class="flex justify-between items-center p-6 border-b border-white/10">
                <img class="app-logo h-10 w-auto" src="https://via.placeholder.com/150x50?text=TecSports" alt="TecSports">
                <button onclick="toggleDrawer()" class="text-4xl text-gray-300 hover:text-white transition">&times;</button>
            </div>
            <nav class="flex-grow p-8 flex flex-col gap-6">
                <a href="#" onclick="toggleDrawer(); showView('home')" class="sidebar-link text-2xl font-display tracking-wide uppercase">🏠 Inicio</a>
                <a href="#" onclick="toggleDrawer(); showView('players')" class="sidebar-link text-2xl font-display tracking-wide uppercase">👥 Jugadores</a>
                <a href="#" onclick="toggleDrawer(); showView('seasons')" class="sidebar-link text-2xl font-display tracking-wide uppercase">🏆 Temporadas</a>
                <a href="#" onclick="toggleDrawer(); showView('duels')" class="sidebar-link text-2xl font-display tracking-wide uppercase">⚔️ Duelos</a>
                <hr class="border-white/10 my-4">
                <a href="#" onclick="toggleDrawer(); showView('cardGen')" class="sidebar-link text-2xl font-display tracking-wide uppercase">🃏 Gen. Carta</a>
                <a href="#" onclick="toggleDrawer(); showView('teamGen')" class="sidebar-link text-2xl font-display tracking-wide uppercase">⚽ Gen. Equipos</a>
            </nav>
            
            <!-- BOTONES ABAJO PEGADOS AL BORDE INFERIOR -->
<div class="p-6 border-t border-white/10 flex gap-4">
    <button id="auth-btn-mobile" onclick="openLoginModal()" class="sidebar-link text-xl flex-1 text-center text-green-400 hover:text-green-300 uppercase font-display tracking-wide">Ingresar</button>
    <div id="user-area-mobile" class="hidden flex-1 relative">
        <button onclick="toggleUserDropdownMobile()" id="user-name-mobile" class="sidebar-link text-xl w-full text-center text-blue-400 uppercase font-display tracking-wide">Usuario ▾</button>
        <div id="user-dropdown-mobile" class="hidden absolute bottom-full left-0 right-0 mb-2 z-50">
            <div class="bg-gray-900 rounded-xl p-2 border border-white/10">
                <a href="#" onclick="toggleUserDropdownMobile(); toggleDrawer(); showView('perfil')" class="block px-4 py-2 hover:bg-white/5 rounded-lg text-sm">👤 Mi Perfil</a>
                <a href="#" onclick="toggleUserDropdownMobile(); toggleDrawer(); openLogoutModal()" class="block px-4 py-2 hover:bg-white/5 rounded-lg text-sm text-red-400">🚪 Cerrar Sesión</a>
            </div>
        </div>
    </div>
                <button onclick="toggleDrawer(); checkAdmin()" class="sidebar-link text-xl flex-1 text-center text-gray-400 hover:text-white uppercase font-display tracking-wide">⚙️ Admin</button>
            </div>
        </div>

        <main class="pb-10 w-full">
            <div id="app-view" class="p-4 md:p-8 max-w-7xl mx-auto"></div>
        </main>
    </div>

    <script src="app.js?v=38"></script>
        <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('sw.js').then(registration => {
            console.log('ServiceWorker registration successful');
          }).catch(err => {
            console.log('ServiceWorker registration failed: ', err);
          });
        });
      }
    </script>
</body>
</html>
